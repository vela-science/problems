name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*-rc.*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout web pipeline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12

      - name: Install
        run: bun install --frozen-lockfile

      - name: Static contracts
        run: bun run check

      - name: Lint and tests
        run: bun run lint && bun run test

      - name: Patch hygiene
        run: bun run format:check

  projection:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VELA_FRONTIERS_ROOT: ${{ github.workspace }}/sources
      VELA_PROJECTION_DATABASE_URL: ${{ secrets.VELA_PROJECTION_DATABASE_URL }}
      VELA_REQUIRE_PROJECTION_TESTS: "1"
    steps:
      - name: Checkout web pipeline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout canonical frontiers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vela-science/erdos-frontier
          path: sources/erdos-frontier
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vela-science/sidon-frontier
          path: sources/sidon-frontier
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vela-science/formal-conjectures-frontier
          path: sources/formal-conjectures-frontier
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vela-science/quantum-codes-frontier
          path: sources/quantum-codes-frontier
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install released Vela verifier
        run: bun run install:vela:linux

      - name: Install reviewed consumer trust pins
        run: bun run --filter @vela/frontier-data trust:install

      - name: Verify current main projection
        run: bun run db:check && bun run projection:verify

      - name: Static contracts
        run: bun run check

      - name: Lint and tests
        run: bun run lint && bun run test

      - name: Production builds
        run: bun run build

      - name: Runtime route and projection smoke
        run: bun run --filter @vela/observatory check:runtime

      - name: Release budgets and manifests
        run: bun run test:budgets && bun run test:manifests

      - name: Patch hygiene
        run: bun run format:check
