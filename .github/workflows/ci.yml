name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*-rc.*"]
    paths-ignore:
      - "apps/observatory/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A push to main runs this too, not only a pull request.
  #
  # Moving the projection job off `push` is what made that necessary: it closed
  # a race with the refresh, and left every commit whose paths the refresh does
  # not watch with nowhere else to be checked. The filter above is
  # `paths-ignore`, and it skips a push only when EVERY changed path matches, so
  # this job covers `apps/www/**`, `docs/**` and the root manifests — everything
  # except an Observatory-only change, which refresh-projection.yml gates
  # instead. (An earlier note here claimed `apps/www/**` was in neither
  # workflow's trigger paths. It is in this one, by not being excluded from it.)
  #
  # Everything here reads committed files — `@vela/observatory-data/release` and
  # `/editorial` are JSON in the tree, not the live projection — so it cannot
  # race the refresh over the database, and there is nothing to order it after.
  #
  # One commit reaches this workflow through no event at all: the editorial
  # snapshot refresh-projection.yml pushes with GITHUB_TOKEN, which by design
  # raises no workflow run. It is checked there instead — that workflow's `gate`
  # checks out the commit its own `refresh` produced and builds it.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout web pipeline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Nothing else in this repository audits its own Actions contracts, so
      # everything the four Repositories are held to through the vela action was
      # unchecked in the pipeline that consumes them. Same tool and the same
      # threshold; uv only because zizmor is not on the Bun toolchain.
      #
      # The version below is this repository's own pin and is not the same
      # object as vela's. There, zizmor is `zizmor==1.29.0` in
      # conformance/pyproject.toml, resolved through a uv.lock that Dependabot
      # advances; here it is a literal inside a `run:`, which no ecosystem
      # updates and nothing compares against vela's. So the two will diverge,
      # and that is fine: what a Repository is held to is decided by the vela
      # release it pins, not by this job. A shared pin would mean shipping a
      # uv project and a lockfile into a Bun workspace to keep one linter's
      # version agreeing across two repositories, which costs more than the
      # divergence does. Bumping it here is a deliberate act, same as
      # `bun-version` below.
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.13"
          # There is no Python project here to cache. The audit resolves one
          # pinned wheel, so a cache would only be a shared mutable directory
          # this job does not need.
          enable-cache: false

      - name: Audit GitHub Actions contracts
        run: uvx zizmor@1.29.0 --offline --min-severity medium --no-progress .

      # `cache-poisoning` reads the `v*-rc.*` tag trigger above as a publishing
      # trigger and the Bun cache as the thing an attacker would poison into a
      # published artifact. This workflow publishes nothing: the release path is
      # a Vercel deploy hook fired from refresh-projection.yml, and on a tag
      # push only `verify` runs — check, lint, test, format, no secrets, no
      # write. There is no artifact for a poisoned cache to reach.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0 # zizmor: ignore[cache-poisoning]
        with:
          bun-version: 1.3.12

      - name: Install
        run: bun install --frozen-lockfile

      - name: Static contracts
        run: bun run check

      - name: Lint and tests
        run: bun run lint && bun run test

      - name: Patch hygiene
        run: bun run format:check

  projection:
    # Manual runs only, which is narrower than it reads: a tag push is a `push`
    # event, so the `v*-rc.*` trigger above reaches `verify` and never this job.
    # That is deliberate rather than an oversight left standing. An RC tag names
    # a commit already on main, and refresh-projection.yml ran this same set
    # against the projection it activated at that commit; re-running it on the
    # tag would read production secrets from a tag ref to re-derive an answer
    # already given. On a push to main the same job is what makes running here
    # a race over one live database, and on a pull request the branch has no
    # business reading production state at all. So `workflow_dispatch` is the
    # only event left that wants this: an operator asking the question directly.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VELA_REPOSITORIES_ROOT: ${{ github.workspace }}/sources
      VELA_PROJECTION_DATABASE_URL: ${{ secrets.VELA_PROJECTION_DATABASE_URL }}
      VELA_REQUIRE_PROJECTION_TESTS: "1"
    steps:
      - name: Checkout web pipeline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout canonical repositories
        uses: ./.github/actions/checkout-repositories

      # Same false positive as the `verify` job above, and less reachable: this
      # job does not run on a push at all.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0 # zizmor: ignore[cache-poisoning]
        with:
          bun-version: 1.3.12

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install released Vela verifier
        uses: ./.github/actions/install-vela

      - name: Verify projection schema
        run: bun run db:check

      - name: Static contracts
        run: bun run check

      - name: Lint and tests
        run: bun run lint && bun run test

      - name: Production builds
        run: bun run build

      - name: Runtime route and projection smoke
        run: bun run --filter @vela/observatory check:runtime

      - name: Release budgets and manifests
        run: bun run test:budgets && bun run test:manifests

      - name: Patch hygiene
        run: bun run format:check

  # An audit nobody notices stopping is not an audit.
  #
  # "Reconstruct the projection" rebuilds the activated projection from nothing
  # and compares the roots, and it can stop running without anyone hearing: it
  # is `workflow_run`-triggered, so it produces `skipped` when the refresh
  # failed, and it produced `cancelled` for three consecutive runs when the next
  # refresh pre-empted it. GitHub notifies on `failure` and on neither of those.
  #
  # Nothing else in the repository asks whether it ever succeeded.
  # `math-atlas-clean-room-evidence.test.ts` reads a frozen evidence document
  # from 2026-08-02 pinned to a commit and a corpus that no longer exist, and it
  # passes forever whether or not the audit runs again.
  #
  # This asks. It runs on every push and pull request, which is where a red mark
  # is actually seen, and it is the only place the question is asked at all.
  reconstruction-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      # 48 hours, against a refresh that is scheduled daily and also fires on
      # every push to main. One missed day is a schedule hiccup; two is the
      # audit having stopped.
      - name: The reconstruction has succeeded recently
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow reconstruct-projection.yml --status success \
            --limit 1 --json updatedAt --jq '.[0].updatedAt // ""')"
          if [ -z "$latest" ]; then
            echo "::error::No successful reconstruction has ever been recorded." \
                 "The projection's rebuild-and-compare obligation is unmet."
            exit 1
          fi
          age=$(( ( $(date -u +%s) - $(date -u -d "$latest" +%s) ) / 3600 ))
          echo "newest successful reconstruction: $latest (${age}h ago)"
          if [ "$age" -gt 48 ]; then
            echo "::error::The newest successful reconstruction is ${age}h old." \
                 "It is cancelled, skipped, or failing — check the workflow, because" \
                 "none of those conclusions notifies anyone on its own."
            exit 1
          fi
