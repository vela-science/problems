name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*-rc.*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VELA_FRONTIERS_ROOT: ${{ github.workspace }}/sources
    steps:
      - name: Checkout web pipeline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout canonical frontiers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vela-science/erdos-frontier
          path: sources/erdos-frontier
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vela-science/sidon-frontier
          path: sources/sidon-frontier
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vela-science/formal-conjectures-frontier
          path: sources/formal-conjectures-frontier
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vela-science/quantum-codes-frontier
          path: sources/quantum-codes-frontier
          fetch-depth: 0

      - name: Create isolated Neon branch
        id: neon-writer
        uses: neondatabase/create-branch-action@99fc7c276b5b811caeb33d2c6b613e10f2125eab # main 2026-07-21
        with:
          api_key: ${{ secrets.NEON_API_KEY }}
          project_id: lingering-meadow-20929365
          parent_branch: main
          branch_name: ci-observatory-${{ github.run_id }}-${{ github.run_attempt }}
          database: vela_observatory
          role: neondb_owner

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12

      - name: Install
        run: bun install --frozen-lockfile

      - name: Bind isolated database roles
        env:
          WRITER_URL: ${{ steps.neon-writer.outputs.db_url_pooled }}
          WRITER_HOST: ${{ steps.neon-writer.outputs.db_host_pooled }}
          WRITER_PASSWORD: ${{ steps.neon-writer.outputs.password }}
          BRANCH_ID: ${{ steps.neon-writer.outputs.branch_id }}
        run: |
          reader_password="$(openssl rand -hex 32)"
          echo "::add-mask::$reader_password"
          echo "::add-mask::$WRITER_URL"
          echo "VELA_EPHEMERAL_BRANCH_ID=$BRANCH_ID" >> "$GITHUB_ENV"
          echo "VELA_PROJECTION_WRITER_DATABASE_URL=$WRITER_URL" >> "$GITHUB_ENV"
          echo "VELA_PROJECTION_READER_PASSWORD=$reader_password" >> "$GITHUB_ENV"
          echo "VELA_PROJECTION_DATABASE_URL=postgresql://observatory_projection_reader:$reader_password@$WRITER_HOST/vela_observatory?sslmode=require" >> "$GITHUB_ENV"
          echo "VELA_LEGACY_DATABASE_URL=postgresql://neondb_owner:$WRITER_PASSWORD@$WRITER_HOST/vela_projection?sslmode=require" >> "$GITHUB_ENV"

      - name: Provision isolated reader
        run: bun run db:provision:reader

      - name: Install released Vela verifier
        run: |
          mkdir -p tools
          curl --fail --silent --show-error --location \
            https://github.com/vela-science/vela/releases/download/v0.912.0/vela-linux-x86_64.tar.gz \
            --output tools/vela-linux-x86_64.tar.gz
          echo "faaec7d8d7503b5addd67d8b25fb18fb1abf4fbd24f6a41957fd7653e0be2502  tools/vela-linux-x86_64.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file tools/vela-linux-x86_64.tar.gz --directory tools ./vela
          test "$(tools/vela --version)" = "vela 0.912.0"
          echo "VELA_BIN=${{ github.workspace }}/tools/vela" >> "$GITHUB_ENV"

      - name: Current-schema and legacy compatibility
        run: bun run db:migrate:check && bun run legacy:verify

      - name: Empty-database migration rehearsal
        env:
          VELA_ALLOW_EPHEMERAL_RESET: "1"
        run: bun run db:reset:ephemeral && bun run --filter @vela/frontier-data db:migrate

      - name: Populate exact candidate projection
        run: bun run --filter @vela/frontier-data refresh

      - name: Verify isolated projection
        run: bun run db:migrate:check && bun run projection:verify && bun run legacy:verify

      - name: Failed refresh leaves current release unchanged
        env:
          VELA_ALLOW_EPHEMERAL_FAILURE_PROBE: "1"
        run: bun run --filter @vela/frontier-data refresh:failure-check

      - name: Static contracts
        run: bun run check

      - name: Lint and tests
        run: bun run lint && bun run test

      - name: Production builds
        run: bun run build

      - name: Runtime route and projection smoke
        run: bun run --filter @vela/observatory check:runtime

      - name: Release budgets and manifests
        run: bun run test:budgets && bun run test:manifests

      - name: Patch hygiene
        run: bun run format:check

      - name: Delete isolated Neon branch
        if: always() && steps.neon-writer.outputs.branch_id != ''
        uses: neondatabase/delete-branch-action@aed9ab1ec86e380312c7b0a9e29942e41349adf6 # main 2026-07-21
        with:
          api_key: ${{ secrets.NEON_API_KEY }}
          project_id: lingering-meadow-20929365
          branch: ${{ steps.neon-writer.outputs.branch_id }}
