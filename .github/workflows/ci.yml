name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*-rc.*"]
    paths-ignore:
      - "apps/observatory/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A push to main runs this too, not only a pull request.
  #
  # Moving the projection job off `push` closed a race with the refresh and
  # opened a gap: `apps/www/**` is in neither workflow's trigger paths, so the
  # commit re-vendoring the docs ran no checks at all. Everything here reads
  # committed files — `@vela/frontier-data/release` and `/editorial` are JSON in
  # the tree, not the live projection — so it cannot race the refresh over the
  # database, and there is nothing to order it after.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout web pipeline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Nothing else in this repository audits its own Actions contracts, so
      # everything the four Frontiers are held to through the vela action was
      # unchecked in the pipeline that consumes them. Same tool and the same
      # threshold; uv only because zizmor is not on the Bun toolchain.
      #
      # The version below is this repository's own pin and is not the same
      # object as vela's. There, zizmor is `zizmor==1.29.0` in
      # conformance/pyproject.toml, resolved through a uv.lock that Dependabot
      # advances; here it is a literal inside a `run:`, which no ecosystem
      # updates and nothing compares against vela's. So the two will diverge,
      # and that is fine: what a Frontier is held to is decided by the vela
      # release it pins, not by this job. A shared pin would mean shipping a
      # uv project and a lockfile into a Bun workspace to keep one linter's
      # version agreeing across two repositories, which costs more than the
      # divergence does. Bumping it here is a deliberate act, same as
      # `bun-version` below.
      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          python-version: "3.13"
          # There is no Python project here to cache. The audit resolves one
          # pinned wheel, so a cache would only be a shared mutable directory
          # this job does not need.
          enable-cache: false

      - name: Audit GitHub Actions contracts
        run: uvx zizmor@1.29.0 --offline --min-severity medium --no-progress .

      # `cache-poisoning` reads the `v*-rc.*` tag trigger above as a publishing
      # trigger and the Bun cache as the thing an attacker would poison into a
      # published artifact. This workflow publishes nothing: the release path is
      # a Vercel deploy hook fired from refresh-projection.yml, and on a tag
      # push only `verify` runs — check, lint, test, format, no secrets, no
      # write. There is no artifact for a poisoned cache to reach.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0 # zizmor: ignore[cache-poisoning]
        with:
          bun-version: 1.3.12

      - name: Install
        run: bun install --frozen-lockfile

      - name: Static contracts
        run: bun run check

      - name: Lint and tests
        run: bun run lint && bun run test

      - name: Patch hygiene
        run: bun run format:check

  projection:
    # Release candidates and manual runs. On a push to main the projection
    # refresh runs this same set AFTER regenerating the projection, so running
    # it here too raced that job over one live database. On a pull request the
    # branch has no business reading production state — that was the original
    # split and it still holds.
    if: github.event_name != 'push' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VELA_FRONTIERS_ROOT: ${{ github.workspace }}/sources
      VELA_PROJECTION_DATABASE_URL: ${{ secrets.VELA_PROJECTION_DATABASE_URL }}
      VELA_REQUIRE_PROJECTION_TESTS: "1"
    steps:
      - name: Checkout web pipeline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout canonical frontiers
        uses: ./.github/actions/checkout-frontiers

      # Same false positive as the `verify` job above, and less reachable: this
      # job does not run on a push at all.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0 # zizmor: ignore[cache-poisoning]
        with:
          bun-version: 1.3.12

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install released Vela verifier
        uses: ./.github/actions/install-vela

      - name: Verify projection schema
        run: bun run db:check

      - name: Static contracts
        run: bun run check

      - name: Lint and tests
        run: bun run lint && bun run test

      - name: Production builds
        run: bun run build

      - name: Runtime route and projection smoke
        run: bun run --filter @vela/observatory check:runtime

      - name: Release budgets and manifests
        run: bun run test:budgets && bun run test:manifests

      - name: Patch hygiene
        run: bun run format:check
